<!DOCTYPE html>
<html>
<head>
<title>Live Dashboard</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<!-- 🕐 BHOPAL LIVE CLOCK -->
<div id="bhopalClock" class="bhopal-clock" aria-label="Bhopal live date and time">
    <div class="clock-location">📍 BHOPAL, MADHYA PRADESH</div>
    <div class="clock-main">
        <div class="analog-clock" aria-hidden="true">
            <div class="clock-number n12">12</div>
            <div class="clock-number n3">3</div>
            <div class="clock-number n6">6</div>
            <div class="clock-number n9">9</div>
            <div class="clock-hand hour-hand" id="hourHand"></div>
            <div class="clock-hand minute-hand" id="minuteHand"></div>
            <div class="clock-hand second-hand" id="secondHand"></div>
            <div class="clock-center"></div>
        </div>
        <div class="digital-clock">
            <div id="bhopalDigitalTime">00:00:00</div>
            <div id="bhopalDate">Loading date...</div>
            <div class="clock-zone">🇮🇳 IST • Asia/Kolkata</div>
        </div>
    </div>
</div>

<h2>📊 Agent Performance Dashboard</h2>

<div id="reportTime"></div>

<input type="text" id="search" placeholder="🔍 Search..." onkeyup="searchTable()">

<div id="cards"></div>

<div class="table-container">
<table id="table">
<thead>
<tr>
<th>S.No</th>
<th>Employee ID</th>
<th>Agent Full Name</th>
<th>Total Login</th>
<th>Net Login</th>
<th>Total Break</th>
<th>Total Meeting</th>
<th>AHT</th>
<th>Total Mature</th>
<th>IB Mature</th>
<th>OB Mature</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<div id="brandingLive">❤️ Powered by Chandan Malakar ❤️</div>

<audio id="notifySound"></audio>

<div id="liveAlert">🚀 Agent Performance Report Updated</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script src="script.js"></script>

</body>
</html>
